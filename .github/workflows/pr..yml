name: PRs and Branches

on:
  push:
    branches-ignore:
      - 'main'
      - 'develop'
  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Tests
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        cfengine:
          [
            'lucee@6',
            'lucee@7',
            'adobe@2023',
            'adobe@2025',
            'boxlang-cfml@1'
          ]
        coldboxVersion: [ '^8.0.5' ]
        experimental: [false]
        include:
          - cfengine: 'lucee@be'
            coldboxVersion: 'be'
            experimental: true
          - cfengine: 'adobe@be'
            coldboxVersion: 'be'
            experimental: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
            distribution: 'temurin'
            java-version: 21

      - name: Setup CommandBox CLI
        uses: Ortus-Solutions/setup-commandbox@v2.0.1

      - name: Install CommandBox-BoxLang
        run: box install commandbox-boxlang

      - name: Install dependencies
        run: |
          box install
          cd test-harness
          box package set dependencies.coldbox=${{ matrix.coldboxVersion }}
          box install

      - name: Start ${{ matrix.cfengine }} server
        run: |
          box server start serverConfigFile="server-${{ matrix.cfengine }}.json" --noSaveSettings --debug
          curl http://127.0.0.1:8520

      - name: Run TestBox Tests
        continue-on-error: ${{ matrix.experimental }}
        run: box testbox run
